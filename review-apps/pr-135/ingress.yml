apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: kiebex-ingress
  namespace: kiebex-pr-135
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pr-135.review.kiel.beer`) && Path(`/api/v1/health`) && Method(`GET`)
      kind: Rule
      services:
        - name: kiebex-api-service
          port: 80
    - match: Host(`pr-135.review.kiel.beer`) && Path(`/api/v1/beer-styles`) && Method(`GET`)
      kind: Rule
      services:
        - name: kiebex-api-service
          port: 80
    - match: Host(`pr-135.review.kiel.beer`)
      kind: Rule
      services:
        - name: kiebex-service
          port: 80
  tls:
    certResolver: le
