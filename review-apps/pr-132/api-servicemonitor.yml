apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kiebex-api
  namespace: kiebex-pr-132
  labels:
    app: kiebex-api
    release: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app: kiebex-api
  namespaceSelector:
    matchNames:
      - kiebex-pr-132
  endpoints:
    - port: web
      path: /api/v1/metrics
      interval: 30s
      scrapeTimeout: 10s
